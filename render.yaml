# ─────────────────────────────────────────────────────────────
# ShiftFlow — Render Blueprint
# Maakt in één keer de API- en web-service aan (Docker).
# Database: gebruik Neon (gratis PostgreSQL) en plak de URL bij DATABASE_URL.
# Redis is NIET nodig (wordt niet gebruikt in de code).
#
# Gebruik: Render → New → Blueprint → kies je repo. Vul daarna enkel
# DATABASE_URL in bij de API-service. De rest is automatisch.
# ─────────────────────────────────────────────────────────────

services:
  # ── API (NestJS) ──
  - type: web
    name: shiftflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Migraties + start zitten in de Dockerfile CMD (betrouwbaarder op Render).
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Neon-connectiestring (plak deze zelf in Render):
      - key: DATABASE_URL
        sync: false
      # Sterke secrets worden automatisch gegenereerd door Render:
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

  # ── Web (Next.js) ──
  - type: web
    name: shiftflow-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      # Zet dit op de URL van shiftflow-api (bv. https://shiftflow-api.onrender.com).
      # De web-service proxyt /api dan naar de API (same-origin → geen CORS).
      - key: API_INTERNAL_URL
        sync: false
